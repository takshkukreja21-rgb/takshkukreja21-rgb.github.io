<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreeWeb - Create Your Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 45px 30px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
        }

        .box {
            margin-top: 30px;
        }

        input {
            width: 65%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
        }

        button {
            padding: 15px 22px;
            margin-left: 5px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #2563eb;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            margin-top: 30px;
            font-size: 20px;
            display: none;
        }

        .url {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌐 FreeWeb</h1>

    <p>Create your own free website address.</p>

    <div class="box">

        <input
            id="username"
            type="text"
            placeholder="Choose a name"
        >

        <button onclick="createSite()">
            Create
        </button>

    </div>

    <div id="result">

        🎉 Your website address:

        <div class="url" id="url"></div>

    </div>

</div>

<script>

function createSite() {

    let username =
        document.getElementById("username").value
        .trim()
        .toLowerCase();

    username = username.replace(/[^a-z0-9-]/g, "");

    if (username.length < 1) {
        alert("Please enter a name!");
        return;
    }

    let website =
        "https://takshkukreja21-rgb.github.io/"
        + username;

    document.getElementById("url").textContent =
        website;

    document.getElementById("result").style.display =
        "block";
}

</script>

</body>
</html>
